<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-100 text-slate-800 flex flex-col items-center p-4 md:p-8 min-h-screen"
  >
    <header class="mb-8 text-center">
      <h1 class="text-3xl md:text-5xl font-bold text-blue-600">
        Book Management System
      </h1>
    </header>
    <div
      class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 w-full gap-6 max-w-screen-2xl mb-8"
    >
      <div
        class="bg-white p-6 rounded-2xl shadow-md flex items-center gap-5 transition hover:translate-y-1"
      >
        <h3 id="totalBooks" class="text-3xl md:text-5xl font-bold text-blue-600">0</h3>
        <p class="text-lg text-slate-600 font-medium">📚 Books</p>
      </div>
      <div
        class="bg-white p-6 rounded-2xl shadow-md flex items-center gap-5 transition hover:translate-y-1"
      >
        <h3 id="totalAuthors" class="text-3xl md:text-5xl font-bold text-blue-600">0</h3>
        <p class="text-lg text-slate-600 font-medium">✍️ Authors</p>
      </div>
      <div
        class="bg-white p-6 rounded-2xl shadow-md flex items-center gap-5 transition hover:translate-y-1"
      >
        <h3 id="totalGenres" class="text-3xl md:text-5xl font-bold text-blue-600">0</h3>
        <p class="text-lg text-slate-600 font-medium">📖 Genres</p>
      </div>
      <div
        class="bg-white p-6 rounded-2xl shadow-md flex items-center gap-5 transition hover:translate-y-1"
      >
        <h3 id="apiBooks" class="text-3xl md:text-5xl font-bold text-blue-600">0</h3>
        <p class="text-lg text-slate-600 font-medium">🌐 API Books</p>
      </div>
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 w-full max-w-screen-2xl">
      <div class="bg-white rounded-2xl shadow-md p-6">
        <form id="bookForm" class="space-y-5">
          <div>
            <h2 class="text-3xl font-bold text-blue-600 mb-6">
              📘 Add New Book
            </h2>
            <label
              for="title"
              class="block font-semibold mb-1 text-sm text-slate-600"
              >Book Title</label
            >
            <input
              type="text"
              id="title"
              name="title"
              placeholder="ramayana"
              class="w-full border border-slate-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
            <small
              class="error text-red-500 text-sm font-medium"
              id="titleError"
            ></small>
          </div>
          <div class="formGroup">
            <label
              for="author"
              class="block font-semibold mb-1 text-sm text-slate-600"
              >Book Author</label
            >
            <input
              type="text"
              id="author"
              name="author"
              placeholder="valmiki"
              class="w-full border border-slate-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
            <small
              class="error text-red-500 text-sm font-medium"
              id="authorError"
            ></small>
          </div>
          <div class="formGroup">
            <label
              for="isbn"
              class="block font-semibold mb-1 text-sm text-slate-600"
              >ISBN</label
            >
            <input
              type="text"
              id="isbn"
              name="isbn"
              placeholder="8481232442"
              class="w-full border border-slate-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
            <small
              class="error text-red-500 text-sm font-medium"
              id="isbnError"
            ></small>
          </div>
          <div class="formGroup">
            <label
              for="publicationDate"
              class="block font-semibold mb-1 text-sm text-slate-600"
              >Publication Date</label
            >
            <input
              type="date"
              id="publicationDate"
              name="publicationDate"
              placeholder="2026-04-23"
              class="w-full border border-slate-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
            <small
              class="error text-red-500 text-sm font-medium"
              id="publicationDateError"
            ></small>
          </div>
          <div class="formGroup">
            <label
              for="genre"
              class="block font-semibold mb-1 text-sm text-slate-600"
              >Genre</label
            >
            <select
              id="genre"
              name="genre"
              class="w-full rounded-md border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="">Select a Genre</option>
              <option value="Religious">Religious</option>
              <option value="Action">Action</option>
              <option value="Adventure">Adventure</option>
              <option value="Comedy">Comedy</option>
              <option value="Historical">Historical</option>
              <option value="Mystery">Mystery</option>
              <option value="Romance">Romance</option>
              <option value="Thriller">Thriller</option>
            </select>
            <small
              class="error text-red-500 text-sm font-medium"
              id="genreError"
            ></small>
          </div>

          <button
            class="w-full p-2.5 bg-blue-500 text-white border-none rounded cursor-pointer text-base font-semibold hover:bg-blue-700 transition-colors"
            type="submit"
          >
            Register Book
          </button>
        </form>
      </div>
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <h3 class="text-2xl font-bold text-blue-600 mb-6">Search & Filters</h3>
        <div class="flex flex-col sm:flex-row gap-3 mb-4 w-full">
          <input
            type="text"
            id="searchBook"
            placeholder=" Search Book by Title"
            class="w-full sm:flex-[3] h-11 border border-slate-300 rounded-md px-3 text-base bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button
            id="fetchBooksBtn"
            class="w-full sm:flex-1 h-11 px-4 bg-blue-500 hover:bg-blue-700 text-white font-semibold rounded-md text-base transition-colors duration-200 whitespace-nowrap cursor-pointer"
          >
            Fetch Books
          </button>
        </div>
        <div class="flex flex-col md:flex-row gap-4 mb-5">
          <select
            id="genreFilter"
            class="w-full rounded-md border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">All Genres</option>
            <option value="Religious">Religious</option>
            <option value="Action">Action</option>
            <option value="Adventure">Adventure</option>
            <option value="Comedy">Comedy</option>
            <option value="Historical">Historical</option>
            <option value="Mystery">Mystery</option>
            <option value="Romance">Romance</option>
            <option value="Thriller">Thriller</option>
          </select>

          <select
            id="sortBooks"
            class="w-full rounded-md border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Sort Books</option>
            <option value="az">A-Z</option>
            <option value="za">Z-A</option>
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
        <div class="border-t pt-6 mt-6">
          <h3 class="text-2xl text-blue-600 font-bold mb-6">
            API Search Results
          </h3>
          <p class="text-slate-500 text-sm mb-5">
            Search by Book ID to fetch book from API
          </p>

          <div class="flex flex-col sm:flex-row gap-3 mb-5 w-full">
            <input
              type="number"
              id="apiBookSearch"
              placeholder="Enter Book ID (1-100)"
              class="w-full sm:flex-[3] h-11 border border-slate-300 rounded-md px-3 text-base bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              id="fetchApiBooks"
              class="w-full sm:flex-1 h-11 px-4 bg-blue-500 hover:bg-blue-700 text-white font-semibold rounded-md text-base transition-colors duration-200 whitespace-nowrap cursor-pointer"
            >
              Search
            </button>
          </div>

          <div id="apiResultList" class="space-y-3 max-h-72 overflow-y-auto"></div>
        </div>
      </div>
    </div>

    <div class="w-full max-w-screen-2xl overflow-x-auto rounded-2xl shadow-md bg-white my-8 mx-auto">
      <div class="text-3xl font-bold text-blue-600 border-b px-6 py-5">
        📚 Book List
      </div>
      <table id="bookTable" class="w-full border-collapse table-auto">
        <thead>
          <tr
            class="bg-gradient-to-br from-blue-500 to-blue-600 text-white uppercase text-xs"
          >
            <th class="px-3 py-3 border-r border-blue-500">Title</th>
            <th class="px-3 py-3 border-r border-blue-500">Author</th>
            <th class="px-3 py-3 border-r border-blue-500">ISBN</th>
            <th class="px-3 py-3 border-r border-blue-500">Publication Date</th>
            <th class="px-3 py-3 border-r border-blue-500">Genre</th>
            <th class="px-3 py-3 border-r border-blue-500">Age</th>
            <th class="px-3 py-3 border-r border-blue-500">Category</th>
            <th class="px-3 py-3 ">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 text-center"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
